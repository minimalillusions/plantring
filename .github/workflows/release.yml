name: Release

# Runs when a GitHub release is published (Releases > Draft a new release > Publish).
# Builds the firmware from the release tag and attaches it to the release:
#   plantring-esp32c3.factory.bin  first install over USB (any ESP flashing tool)
#   plantring-esp32c3.ota.bin      manual over-the-air update
#   plantring-esp32c3.elf          debug symbols for decoding crash logs
#   manifest.json                  ESP Web Tools and update manifest
# Tag the release after the firmware version: v1.2.0 for project_version "1.2.0".
# When this workflow succeeds, "Publish Pages" runs again, so the manifest served by
# the web installer links to these release notes.

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware
    permissions:
      contents: read
    uses: ./.github/workflows/firmware.yml

  attach:
    name: Attach firmware
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload release assets
    steps:
      - name: Download firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: build
          merge-multiple: true

      - name: Prepare release assets
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find build -name manifest.json)
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one manifest.json in the firmware artifact, found ${#manifests[@]}."
            exit 1
          fi
          manifest="${manifests[0]}"
          src=$(dirname "${manifest}")

          # The version the firmware actually reports, straight from the build.
          version=$(jq -r '.version' "${manifest}")
          if [[ "${TAG#[vV]}" != "${version}" ]]; then
            echo "::warning::Release tag ${TAG} does not match the firmware version ${version}. Bump project_version in plantring.yaml, push, then tag the release v<project_version>."
          fi

          mkdir assets
          cp "${src}"/*.factory.bin "${src}"/*.ota.bin assets/
          if compgen -G "${src}/*.elf" > /dev/null; then
            cp "${src}"/*.elf assets/
          fi

          # Put this release's notes into the manifest (Home Assistant shows them
          # with the firmware update).
          jq --arg notes "${RELEASE_NOTES}" --arg url "${RELEASE_URL}" '
            .version as $v
            | .builds[].ota |= (
                .summary = (if $notes == "" then "PlantRing firmware \($v)" else $notes end)
                | .release_url = $url
              )' "${manifest}" > assets/manifest.json
          ls -l assets

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" assets/* --clobber
